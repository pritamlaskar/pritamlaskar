<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="372" viewBox="0 0 1000 372" role="img"><defs><radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="760" cy="330" r="380"><stop offset="0" stop-color="#7dffb8" stop-opacity="0.12"/><stop offset="1" stop-color="#7dffb8" stop-opacity="0"/></radialGradient><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity=".07"/></pattern></defs><rect x=".5" y=".5" width="999" height="371" rx="22" fill="#07080a" stroke="#1c2127"/><rect x=".5" y=".5" width="999" height="371" rx="22" fill="url(#dots)"/><text x="40" y="46" font-family="ui-monospace,'SF Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="12" letter-spacing="1.2" fill="#8b9094">A TYPICAL MONDAY</text><circle cx="832" cy="42" r="4" fill="#7dffb8"><animate attributeName="opacity" values="1;.25;1" dur="2.4s" repeatCount="indefinite"/></circle><text x="844" y="46" font-family="ui-monospace,'SF Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="12" letter-spacing="1" fill="#7dffb8">after automation</text><line x1="0" y1="68" x2="1000" y2="68" stroke="#1c2127"/><rect x="32" y="92" width="452" height="218" rx="18" fill="#0f1216" stroke="#1c2127" stroke-opacity="1"/><text x="60" y="132" font-family="ui-monospace,'SF Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="12" letter-spacing="2.4" fill="#e8a24a">BEFORE</text><circle cx="68" cy="169" r="10" fill="none" stroke="#e8a24a" stroke-opacity=".6"/><path d="M64 165 l8 8 M72 165 l-8 8" stroke="#e8a24a" stroke-width="1.6" stroke-linecap="round"/><text x="90" y="174" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#c9cbcc">Copy new enquiries into a spreadsheet</text><circle cx="68" cy="211" r="10" fill="none" stroke="#e8a24a" stroke-opacity=".6"/><path d="M64 207 l8 8 M72 207 l-8 8" stroke="#e8a24a" stroke-width="1.6" stroke-linecap="round"/><text x="90" y="216" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#c9cbcc">Remember to follow up with each one</text><circle cx="68" cy="253" r="10" fill="none" stroke="#e8a24a" stroke-opacity=".6"/><path d="M64 249 l8 8 M72 249 l-8 8" stroke="#e8a24a" stroke-width="1.6" stroke-linecap="round"/><text x="90" y="258" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#c9cbcc">Build the weekly report by hand</text><circle cx="68" cy="295" r="10" fill="none" stroke="#e8a24a" stroke-opacity=".6"/><path d="M64 291 l8 8 M72 291 l-8 8" stroke="#e8a24a" stroke-width="1.6" stroke-linecap="round"/><text x="90" y="300" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#c9cbcc">Find the mistakes after the client does</text><rect x="516" y="92" width="452" height="218" rx="18" fill="#0f1216" stroke="#7dffb8" stroke-opacity="0.55"/><rect x="516" y="92" width="452" height="218" rx="18" fill="url(#glow)"/><text x="544" y="132" font-family="ui-monospace,'SF Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="12" letter-spacing="2.4" fill="#7dffb8">AFTER</text><circle cx="552" cy="169" r="10" fill="#7dffb8"/><path d="M547 169 l3.6 3.8 l6.6 -7.4" fill="none" stroke="#04120a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="574" y="174" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#ececea">Enquiries saved and answered within minutes</text><circle cx="552" cy="211" r="10" fill="#7dffb8"/><path d="M547 211 l3.6 3.8 l6.6 -7.4" fill="none" stroke="#04120a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="574" y="216" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#ececea">Follow ups go out on schedule, automatically</text><circle cx="552" cy="253" r="10" fill="#7dffb8"/><path d="M547 253 l3.6 3.8 l6.6 -7.4" fill="none" stroke="#04120a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="574" y="258" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#ececea">The report lands in your inbox every Monday</text><circle cx="552" cy="295" r="10" fill="#7dffb8"/><path d="M547 295 l3.6 3.8 l6.6 -7.4" fill="none" stroke="#04120a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="574" y="300" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#ececea">Problems are flagged the same day</text><text x="500.0" y="346" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="17" fill="#8b9094">Your team spends its time on the work only people can do.</text></svg>