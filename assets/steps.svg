<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="178" viewBox="0 0 1000 178" role="img"><defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity=".07"/></pattern></defs><rect x="0.5" y=".5" width="231" height="177" rx="20" fill="#0f1216" stroke="#1c2127"/><rect x="0.5" y=".5" width="231" height="177" rx="20" fill="url(#dots)"/><text x="24" y="40" font-family="ui-monospace,'SF Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="12" letter-spacing="1.6" fill="#7dffb8">01</text><line x1="58" y1="36" x2="208" y2="36" stroke="#7dffb8" stroke-opacity=".25"/><text x="24" y="76" font-family="Georgia,'Times New Roman',serif" font-size="26" fill="#ececea">A free call</text><text x="24" y="106" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#8b9094">You tell me what is slowing</text><text x="24" y="126" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#8b9094">the team down. I tell you</text><text x="24" y="146" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#8b9094">honestly what is worth</text><text x="24" y="166" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#8b9094">automating.</text><rect x="256.5" y=".5" width="231" height="177" rx="20" fill="#0f1216" stroke="#1c2127"/><rect x="256.5" y=".5" width="231" height="177" rx="20" fill="url(#dots)"/><text x="280" y="40" font-family="ui-monospace,'SF Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="12" letter-spacing="1.6" fill="#7dffb8">02</text><line x1="314" y1="36" x2="464" y2="36" stroke="#7dffb8" stroke-opacity=".25"/><text x="280" y="76" font-family="Georgia,'Times New Roman',serif" font-size="26" fill="#ececea">A simple plan</text><text x="280" y="106" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#8b9094">What I will build, what it</text><text x="280" y="126" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#8b9094">saves and how long it takes,</text><text x="280" y="146" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#8b9094">in plain English, before you</text><text x="280" y="166" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#8b9094">commit.</text><rect x="512.5" y=".5" width="231" height="177" rx="20" fill="#0f1216" stroke="#1c2127"/><rect x="512.5" y=".5" width="231" height="177" rx="20" fill="url(#dots)"/><text x="536" y="40" font-family="ui-monospace,'SF Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="12" letter-spacing="1.6" fill="#7dffb8">03</text><line x1="570" y1="36" x2="720" y2="36" stroke="#7dffb8" stroke-opacity=".25"/><text x="536" y="76" font-family="Georgia,'Times New Roman',serif" font-size="26" fill="#ececea">I build it</text><text x="536" y="106" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#8b9094">You see it working early and</text><text x="536" y="126" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#8b9094">test it on your own data, so</text><text x="536" y="146" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#8b9094">there are no surprises.</text><rect x="768.5" y=".5" width="231" height="177" rx="20" fill="#0f1216" stroke="#1c2127"/><rect x="768.5" y=".5" width="231" height="177" rx="20" fill="url(#dots)"/><text x="792" y="40" font-family="ui-monospace,'SF Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="12" letter-spacing="1.6" fill="#7dffb8">04</text><line x1="826" y1="36" x2="976" y2="36" stroke="#7dffb8" stroke-opacity=".25"/><text x="792" y="76" font-family="Georgia,'Times New Roman',serif" font-size="26" fill="#ececea">You're covered</text><text x="792" y="106" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#8b9094">Alerts if anything breaks,</text><text x="792" y="126" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#8b9094">written instructions and a</text><text x="792" y="146" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#8b9094">walkthrough for your team.</text></svg>