ill="#12161b" stroke="#7dffb8" stroke-width="1.5"/><text x="762" y="218" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#ececea">Records updated</text><text x="762" y="234" font-family="ui-monospace,'SF Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="10.5" fill="#8b9094">no copying and pasting</text><rect x="716" y="268" width="236" height="46" rx="13" fill="#0f1216" stroke="#1c2127" stroke-opacity="1"/><circle cx="742" cy="291.0" r="5" fill="#12161b" stroke="#7dffb8" stroke-width="1.5"/><text x="762" y="288" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#ececea">Report sent</text><text x="762" y="304" font-family="ui-monospace,'SF Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="10.5" fill="#8b9094">to your inbox every Monday</text><circle r="4.5" fill="#7dffb8"><animateMotion dur="3.6s" repeatCount="indefinite" path="M742 104 L742 268"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="3.6s" repeatCount="indefinite"/></circle></svg>